name: BinnenNav
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BinnenNav:
    type: application
    platform: iOS
    sources: [BinnenNav]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.ehb.ayoub.BinnenNav
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "De camera is nodig om je de weg te tonen in augmented reality."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YT537H433D
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
